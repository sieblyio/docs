version: 2
updates:
  - package-ecosystem: npm
    directory: /releases
    schedule:
      interval: cron
      # Dependabot requires at least 24 hours between checks.
      cronjob: '19 0 * * *'
    versioning-strategy: increase
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '@siebly/hyperliquid-api'
      - dependency-name: bybit-api
      - dependency-name: binance
      - dependency-name: '@siebly/kraken-api'
      - dependency-name: coinbase-api
      - dependency-name: okx-api
    groups:
      sdk-releases:
        patterns:
          - '@siebly/hyperliquid-api'
          - bybit-api
          - binance
          - '@siebly/kraken-api'
          - coinbase-api
          - okx-api
    cooldown:
      exclude:
        - '@siebly/hyperliquid-api'
        - bybit-api
        - binance
        - '@siebly/kraken-api'
        - coinbase-api
        - okx-api
