name: Build and deploy SDK documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Production runs finish in sequence; newer commits supersede checks within each PR.
concurrency:
  group: sdk-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    env:
      DOCS_SITE_URL: https://sieblyio.github.io/docs/
      DOCS_INDEXABLE: '1'
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Resolve npm releases and plan the build
        id: plan
        run: node scripts/ci-plan.mjs
      - name: Check content, evidence, release selection and CI planning
        run: |
          npm run check:content
          npm run check:starters
          npm run compat:check-report
          npm run check:releases
          npm run check:ci
          npm run check:site-tests
          npm run check:release-update
          npm run check:release-refresh
      - name: Build all SDK sites from the resolved release records
        env:
          DOCS_RELEASE_RECORD: .work/available-releases.json
        run: npm run build:release
      - name: Upload validated Pages output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: >-
      needs.build.outputs.deploy == 'true' &&
      github.repository == 'sieblyio/docs' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No repository checkout or build code runs with deployment permissions.
      - name: Reject an obsolete main revision
        id: current
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(curl --fail --silent --show-error --retry 3 --max-time 30 https://api.github.com/repos/sieblyio/docs/commits/main | jq -er '.sha')"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: a newer main revision is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
